[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "B",      # bugbear
    "SIM",    # simplify
    "D",      # pydocstyle
]
ignore = [
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D106",   # missing docstring in public nested class
    "D107",   # missing docstring in __init__ (covered by class docstring)
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "D413",   # missing blank line after last section
    "E501",   # line too long (handled by formatter for code; unavoidable in strings)
]
fixable = ["I", "F401", "W", "E"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E402", "SIM117"]
"prompts/*" = ["D", "E501"]
"server/approval_server.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# Strict typing for core application code
[[tool.mypy.overrides]]
module = ["tools.*", "workflow.*"]
disallow_untyped_defs = true
disable_error_code = ["no-any-return", "arg-type"]

# Agent module: strict + suppress union-attr from Anthropic/Google SDK types
[[tool.mypy.overrides]]
module = ["agent.*"]
disallow_untyped_defs = true
disable_error_code = ["no-any-return", "union-attr", "arg-type"]

# Memory database models: suppress declarative_base() false positives
[[tool.mypy.overrides]]
module = ["memory.database"]
disallow_untyped_defs = false
disable_error_code = ["valid-type", "misc", "no-untyped-def"]

# Memory mixins: suppress SQLAlchemy Column type and mixin attr-defined errors
[[tool.mypy.overrides]]
module = [
    "memory.workflow",
    "memory.articles",
    "memory.approvals",
    "memory.dashboard_queries",
    "memory.taxonomy",
    "memory.oauth",
    "memory.drift",
    "memory.backup",
    "memory.memory",
]
disallow_untyped_defs = true
disable_error_code = ["attr-defined", "assignment", "arg-type", "return-value", "index", "call-overload"]

# Server: suppress stubs and Flask-specific patterns
[[tool.mypy.overrides]]
module = ["server.*"]
disable_error_code = ["import-untyped", "arg-type", "method-assign", "assignment", "no-any-return"]

# Tests: suppress common test assertion patterns
[[tool.mypy.overrides]]
module = ["tests", "tests.*", "tests.*.*"]
disable_error_code = ["union-attr", "index", "operator", "var-annotated"]

# Scripts: not part of core app, relax checking
[[tool.mypy.overrides]]
module = ["scripts", "scripts.*"]
disable_error_code = ["assignment", "attr-defined", "arg-type", "var-annotated"]

# Utils collectors: suppress minor annotation issues
[[tool.mypy.overrides]]
module = ["utils.article_collectors.*"]
disable_error_code = ["var-annotated"]

# Third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "serpapi",
    "serpapi.*",
    "newsapi",
    "newsapi.*",
    "langfuse",
    "langfuse.*",
    "apscheduler",
    "apscheduler.*",
    "google",
    "google.*",
    "genai",
    "genai.*",
    "bleach",
    "flask_wtf",
    "flask_wtf.*",
    "authlib",
    "authlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --tb=short"
markers = [
    "acceptance: full workflow acceptance tests",
]

[tool.coverage.run]
source = ["agent", "tools", "utils", "memory", "workflow"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 99
show_missing = true
skip_empty = true
exclude_lines = [
    "raise Exception.'Unreachable'.",
    "return .*.  # unreachable",
    "return response  # type: ignore",
]

[tool.mutmut]
paths_to_mutate = [
    "utils/consolidate.py",
    "tools/fetch_articles_tool.py",
    "tools/deduplicate_articles_tool.py",
    "tools/evaluate_blog_post_tool.py",
    "memory/memory.py",
]
tests_dir = ["tests"]
pytest_add_cli_args = ["-x", "-q", "--no-header", "--tb=no", "-o", "addopts="]
